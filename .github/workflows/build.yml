# Daily rebuild of the feed files from the live shop, before Awin's 03:00 UTC fetch. GitHub Pages serves them.
# Scheduled at 19:00 UTC, not 02:00: GitHub starts scheduled jobs hours late (02:00 ran at 08:28 and 08:51 on
# 12 and 13 Oct 2026), so an early-evening start still lands before Awin's fetch.
# A failed build emails the repository owner; the previous good file stays in place.
name: Build feeds

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the feed files
        run: python3 build.py
      - name: Commit any changes
        if: always()
        run: |
          git config user.name "Told feed builder"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Feeds rebuilt $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing changed"
          git push
